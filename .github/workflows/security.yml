name: Runtime image security
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (Node.js 24)
        with:
          persist-credentials: false
      - name: Install pinned quality tools
        run: |
          python3 -m venv "$RUNNER_TEMP/harmonia-quality"
          "$RUNNER_TEMP/harmonia-quality/bin/python" -m pip install -r requirements-dev.txt
      - name: Check lint and formatting
        run: '"$RUNNER_TEMP/harmonia-quality/bin/python" scripts/lint.py'
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (Node.js 24)
        with:
          persist-credentials: false
      - name: Install browser test dependencies
        run: |
          npm --prefix web ci
          python3 -m venv "$RUNNER_TEMP/harmonia-browser"
          "$RUNNER_TEMP/harmonia-browser/bin/python" -m pip install -r requirements.lock
          "$RUNNER_TEMP/harmonia-browser/bin/python" -m pip install playwright==1.56.0 coverage==7.13.1
          "$RUNNER_TEMP/harmonia-browser/bin/python" -m playwright install --with-deps chromium --only-shell
      - name: Measure backend regression coverage
        run: '"$RUNNER_TEMP/harmonia-browser/bin/python" scripts/verify_coverage.py'
      - name: Verify page loading and background refresh feedback
        run: '"$RUNNER_TEMP/harmonia-browser/bin/python" scripts/verify_page_loading.py'
      - name: Verify production CSP and dynamic React styling
        run: '"$RUNNER_TEMP/harmonia-browser/bin/python" scripts/verify_browser_csp.py'
  image:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (Node.js 24)
        with:
          persist-credentials: false
      - name: Build exact runtime
        run: docker build --build-arg VCS_REF=${{ github.sha }} -t harmonia:ci .
      - name: Verify runtime and regressions
        run: |
          docker run --rm --read-only --cap-drop ALL --cap-add CHOWN --cap-add DAC_OVERRIDE --cap-add FOWNER --cap-add SETUID --cap-add SETGID --security-opt no-new-privileges --tmpfs /tmp:rw,noexec,nosuid,size=64m -v "$PWD/tests:/app/tests:ro" harmonia:ci python -c "import os; assert os.getuid()==10001; import harmonia.api"
          docker run --rm --read-only --cap-drop ALL --cap-add CHOWN --cap-add DAC_OVERRIDE --cap-add FOWNER --cap-add SETUID --cap-add SETGID --security-opt no-new-privileges --tmpfs /tmp:rw,noexec,nosuid,size=64m -v "$PWD/tests:/app/tests:ro" -w /app -v "$PWD/Dockerfile:/app/Dockerfile:ro" -v "$PWD/scripts:/app/scripts:ro" harmonia:ci python -m unittest discover -s /app/tests
      - name: Verify configuration startup and privilege dropping
        run: python3 scripts/verify_container_startup.py harmonia:ci
      - name: Verify patched zlib and native runtime dependencies
        run: docker run --rm -v "$PWD/scripts:/app/scripts:ro" harmonia:ci python /app/scripts/verify_runtime_dependencies.py
      - name: Frontend regressions
        run: |
          npm --prefix web ci
          for script in tests/*.cjs tests/*.mjs; do node "$script" || exit 1; done
      - name: Scan actual image OS and Python packages
        env:
          DOCKER_SCOUT_HUB_USER: ${{ secrets.DOCKER_SCOUT_HUB_USER }}
          DOCKER_SCOUT_HUB_PASSWORD: ${{ secrets.DOCKER_SCOUT_HUB_PASSWORD }}
        run: |
          mkdir -p verification
          docker save harmonia:ci -o verification/image.tar
          chmod 644 verification/image.tar
          docker run --rm -v "$PWD/verification:/scan:ro" -e DOCKER_SCOUT_HUB_USER -e DOCKER_SCOUT_HUB_PASSWORD docker/scout-cli:1.25.0@sha256:d385046155c692ff5f4752fc32d612202a9211ae2c7904ae52bb65f9e1dc620a cves --exit-code --only-severity critical,high archive:///scan/image.tar
